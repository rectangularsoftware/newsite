<title>{{ .Title }}</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name=theme-color content="#ff7d00" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  :root {
    --bs-primary: #423e28;
    --bs-primary-rgb: 56, 57, 47;
    --bs-secondary: #172a3a;
    --bs-secondary-rgb: 23, 42, 58;
    --bs-light: #f1f2f6;
    --bs-light-rgb: 241, 242, 246;
    --bs-info: #19647e;
    --bs-info-rgb: 49, 99, 124;
    --bs-success: #688e26;
    --bs-success-rgb: 104, 142, 38;
    --bs-warning: #ffe156;
    --bs-warning-rgb: 255, 225, 86;
    --bs-link-color-rgb: var(--bs-primary-rgb);
    --bs-link-hover-color-rgb: 0, 68, 136;
    --bs-body-color: #f8f4e3;
  }
  .btn-primary {
    --bs-btn-bg: var(--bs-primary);
    --bs-btn-color: var(--bs-body-color);
    --bs-btn-active-color: var(--bs-body-color);
    --bs-btn-hover-color: var(--bs-body-color);
    --bs-btn-border-color: #423e28;
    --bs-btn-hover-bg: #ee6c00;
    --bs-btn-hover-border-color: #423e28;
    --bs-btn-active-bg: #ff8e00;
    --bs-btn-active-border-color: #423e28;
  }
  .btn-secondary {
    --bs-btn-bg: var(--bs-secondary);
    --bs-btn-color: var(--bs-body-color);
    --bs-btn-border-color: var(--bs-secondary);
    --bs-btn-hover-bg: #061929;
    --bs-btn-hover-border-color: #000818;
    --bs-btn-active-bg: #283b4b;
    --bs-btn-active-border-color: #000818;
  }
  html {min-height: 100%;}
  body {display: flex;
        flex-direction: column;
        min-height: 100%;
        background-color: #cc4a00;
        background-image: linear-gradient(to bottom, #cc4a00, #ff7d00, #bb3900);}
  main {flex: 1;}
  .form-control {color: var(--bs-primary);}
  .form-control:focus {color: var(--bs-primary); border-color: #ff7d00; box-shadow: 0 0 0 .25rem rgba(255, 125, 0, .25);}
  .devicon {font-size: 40pt;}
</style>
<link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
