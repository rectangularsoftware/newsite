{{ define "main" }}
  <img src="/logo.png" height="84" alt="Rectangular Software"/>
  <h5 class="mt-2 d-flex align-items-center">
    <img src="/uk.svg" height="28" class="me-2" alt="UK flag"/>
    UK-based bespoke software development services
  </h5>
  <div class="mt-4 lead">
    {{ .Content }}
  </div>
  <form method="post" action="https://forms.un-static.com/forms/52654e608ad3bdece62d5a29af0dfea9ff89de54">
    <div class="form-group row">
      <label for="inputName" class="col-sm-2 col-form-label">Name</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" id="inputName" placeholder="Please enter your name">
      </div>
    </div>
    <div class="form-group row">
      <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <div class="input-group">
          <i class="input-group-text bi bi-envelope-at"></i>
          <input type="email" class="form-control" id="inputEmail" placeholder="Email">
        </div>
      </div>
    </div>
    <div class="form-group row">
      <label for="inputMessage" class="col-sm-2 col-form-label">Message</label>
      <div class="col-sm-10">
        <textarea name="inputMessage" cols="40" rows="8" class="form-control"></textarea>
      </div>
    </div>
    <div class="form-group row mt-2">
      <div class="col-sm-12 text-end">
        <button type="submit" class="btn btn-primary">Send</button>
      </div>
    </div>
    <div class="text-center">
      <p><small>Powered by <a rel="nofollow" href="Un-static Forms">Un-static Forms</a></small></p>
    </div>
  </form>
{{ end }}
