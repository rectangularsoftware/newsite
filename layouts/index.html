{{ define "main" }}
  <div class="row">
    <div class="col-md-8">
      <img src="logo.png" height="84"/>
      <h5 class="mt-2 d-flex align-items-center">
        <img src="uk.svg" height="28" class="me-2"/>
        UK-based bespoke software development services
      </h5>
      <div class="mt-4 lead">
        {{ .Content }}
      </div>
      <div class="text-center">
        <div class="d-flex">
          <a href="#" class="btn btn-secondary flex-fill">Does my business need an app?</a>
          <a href="#" class="btn btn-secondary flex-fill mx-2">How much does it cost?</a>
          <a href="#" class="btn btn-secondary flex-fill">What do I need to provide?</a>
        </div>
        <p class="mt-3">Any other questions? Ready to get started?</p>
        <a href="#" class="btn btn-lg btn-primary mb-4">Contact Us</a>
      </div>
    </div>
    <div class="col-md-4">
      <div class="position-relative">
        <img src="iphone16.png" class="img-fluid position-relative" style="z-index: 6;"/>
        <div class="carousel slide carousel-fade position-absolute top-0 w-100 h-100 p-2" data-bs-ride="carousel">
          <div class="carousel-inner h-100 text-center" style="border-radius: 12%">
            <div class="carousel-item active bg-info h-100" style="padding-top: 20%">
              Slide 1
            </div>
            <div class="carousel-item bg-success h-100" style="padding-top: 20%">
              Slide 2
            </div>
            <div class="carousel-item bg-warning h-100" style="padding-top: 20%">
              Slide 3
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{{ end }}
